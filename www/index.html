<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f5">
  <!-- iPhone: pantalla completa al abrir desde el ícono -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="10.000">
  <meta name="format-detection" content="telephone=no">
  <title>Anotador 10.000</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <script src="js/app.js"></script>
  <script>
    // Modo sin conexión para la versión web instalada (en la app Android no hace falta).
    if ('serviceWorker' in navigator && !window.Capacitor && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
